name: Refresh Sleeper League Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "15 * * * *"

permissions:
  contents: write

concurrency:
  group: sleeper-league-snapshot-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch Sleeper league
        run: python scripts/fetch_sleeper.py

      - name: Commit refreshed snapshot
        run: |
          git config user.name "sleeper-bridge-bot"
          git config user.email "actions@users.noreply.github.com"

          cp data/league_snapshot.json /tmp/league_snapshot.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/league_snapshot.json data/league_snapshot.json
          git add data/league_snapshot.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh Sleeper league snapshot"
            git push origin HEAD:main
          fi
