name: Refresh Sleeper League Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_sleeper.py
      - run: |
          git config user.name "sleeper-bridge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/league_snapshot.json
          git diff --cached --quiet || (git commit -m "Refresh Sleeper league snapshot" && git push)
